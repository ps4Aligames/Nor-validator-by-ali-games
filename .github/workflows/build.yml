name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PS4_NOR_Inspector src/ps4_nor_inspector.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PS4_NOR_Inspector-Windows-x64
          path: dist/PS4_NOR_Inspector.exe
